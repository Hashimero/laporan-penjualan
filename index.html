<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir D'Fresto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Sembunyikan scrollbar biar lebih clean di HP */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased selection:bg-red-200">

<div class="max-w-md mx-auto bg-white min-h-screen relative pb-32 shadow-xl">
    
    <!-- HEADER -->
    <header class="sticky top-0 bg-white border-b border-gray-100 p-4 z-10 flex justify-between items-center shadow-sm">
        <div>
            <h1 class="text-xl font-extrabold text-red-600 tracking-tight">D'FRESTO</h1>
            <p id="tanggalHariIni" class="text-xs text-gray-400 font-medium"></p>
        </div>
        <button onclick="resetData()" class="text-xs font-bold text-gray-400 hover:text-red-500 bg-gray-50 px-3 py-1.5 rounded-full transition-colors">
            Reset Hari Ini
        </button>
    </header>

    <!-- MENU LIST CONTAINER -->
    <main class="p-4" id="menuContainer">
        <!-- Render via JavaScript -->
    </main>

    <!-- BOTTOM ACTION BAR -->
    <div class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-gray-100 p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] z-20">
        <div class="flex justify-between items-center mb-3">
            <span class="text-sm font-semibold text-gray-500">Total Omset:</span>
            <span id="totalOmset" class="text-xl font-bold text-gray-900">Rp 0</span>
        </div>
        <button onclick="copyToWA()" class="w-full bg-red-600 hover:bg-red-700 active:scale-[0.98] text-white font-bold py-3.5 rounded-xl transition-all shadow-md shadow-red-200">
            Copy ke WhatsApp
        </button>
    </div>

</div>

<script>
    // Data Menu D'Fresto - Dipisah semua sesuai instruksi
    const menuData = [
        // ALA CARTE
        { id: 'ac_sayap', category: 'Ala Carte', name: 'Sayap', price: 8000 },
        { id: 'ac_pahabawah', category: 'Ala Carte', name: 'Paha Bawah', price: 8000 },
        { id: 'ac_dada', category: 'Ala Carte', name: 'Dada', price: 10000 },
        { id: 'ac_pahaatas', category: 'Ala Carte', name: 'Paha Atas', price: 10000 },
        
        // Geprek
        { id: 'ac_geprek_sayap', category: 'Ala Carte', name: 'Geprek Sayap', price: 12000 },
        { id: 'ac_geprek_pahabawah', category: 'Ala Carte', name: 'Geprek Paha Bawah', price: 12000 },
        { id: 'ac_geprek_dada', category: 'Ala Carte', name: 'Geprek Dada', price: 14000 },
        { id: 'ac_geprek_pahaatas', category: 'Ala Carte', name: 'Geprek Paha Atas', price: 14000 },
        
        // Superhot
        { id: 'ac_superhot_sayap', category: 'Ala Carte', name: 'Superhot Sayap', price: 12000 },
        { id: 'ac_superhot_pahabawah', category: 'Ala Carte', name: 'Superhot Paha Bawah', price: 12000 },
        { id: 'ac_superhot_dada', category: 'Ala Carte', name: 'Superhot Dada', price: 14000 },
        { id: 'ac_superhot_pahaatas', category: 'Ala Carte', name: 'Superhot Paha Atas', price: 14000 },
        
        // Saus Keju
        { id: 'ac_keju_sayap', category: 'Ala Carte', name: 'Saus Keju Sayap', price: 12000 },
        { id: 'ac_keju_pahabawah', category: 'Ala Carte', name: 'Saus Keju Paha Bawah', price: 12000 },
        { id: 'ac_keju_dada', category: 'Ala Carte', name: 'Saus Keju Dada', price: 14000 },
        { id: 'ac_keju_pahaatas', category: 'Ala Carte', name: 'Saus Keju Paha Atas', price: 14000 },
        
        // Superhot + Keju
        { id: 'ac_superkeju_sayap', category: 'Ala Carte', name: 'Superhot + Keju Sayap', price: 16000 },
        { id: 'ac_superkeju_pahabawah', category: 'Ala Carte', name: 'Superhot + Keju Paha Bawah', price: 16000 },
        { id: 'ac_superkeju_dada', category: 'Ala Carte', name: 'Superhot + Keju Dada', price: 18000 },
        { id: 'ac_superkeju_pahaatas', category: 'Ala Carte', name: 'Superhot + Keju Paha Atas', price: 18000 },
        
        // PAKET NASI
        { id: 'pn_sayap', category: 'Paket Nasi', name: 'Paket Sayap', price: 11000 },
        { id: 'pn_pahabawah', category: 'Paket Nasi', name: 'Paket Paha Bawah', price: 11000 },
        { id: 'pn_dada', category: 'Paket Nasi', name: 'Paket Dada', price: 13000 },
        { id: 'pn_pahaatas', category: 'Paket Nasi', name: 'Paket Paha Atas', price: 13000 },
        
        // Paket Ayam Saus
        { id: 'pn_ayamsaus_sayap', category: 'Paket Nasi', name: 'Pkt Ayam Saus Sayap', price: 15000 },
        { id: 'pn_ayamsaus_pahabawah', category: 'Paket Nasi', name: 'Pkt Ayam Saus Paha Bawah', price: 15000 },
        { id: 'pn_ayamsaus_dada', category: 'Paket Nasi', name: 'Pkt Ayam Saus Dada', price: 16000 },
        { id: 'pn_ayamsaus_pahaatas', category: 'Paket Nasi', name: 'Pkt Ayam Saus Paha Atas', price: 16000 },
        
        // Paket Superhot + Keju
        { id: 'pn_superkeju_sayap', category: 'Paket Nasi', name: 'Pkt Superhot + Keju Sayap', price: 17000 },
        { id: 'pn_superkeju_pahabawah', category: 'Paket Nasi', name: 'Pkt Superhot + Keju Paha Bawah', price: 17000 },
        { id: 'pn_superkeju_dada', category: 'Paket Nasi', name: 'Pkt Superhot + Keju Dada', price: 19000 },
        { id: 'pn_superkeju_pahaatas', category: 'Paket Nasi', name: 'Pkt Superhot + Keju Paha Atas', price: 19000 },

        // ADD-ON
        { id: 'add_nasi', category: 'Tambahan', name: 'Nasi', price: 4000 },
        { id: 'add_sambal', category: 'Tambahan', name: 'Sambal Geprek', price: 4000 },
        { id: 'add_superhot', category: 'Tambahan', name: 'Superhot', price: 4000 },
        { id: 'add_keju', category: 'Tambahan', name: 'Keju', price: 4000 },
    ];

    // State untuk menyimpan quantity
    let state = JSON.parse(localStorage.getItem('dfresto_state')) || {};

    // Inisialisasi Tanggal
    const tglOptions = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('tanggalHariIni').innerText = new Date().toLocaleDateString('id-ID', tglOptions);

    // Render UI
    function renderMenu() {
        const container = document.getElementById('menuContainer');
        container.innerHTML = '';
        
        let currentCategory = '';

        menuData.forEach(item => {
            // Render Header Kategori
            if (item.category !== currentCategory) {
                const catHeader = document.createElement('h2');
                catHeader.className = 'text-sm font-bold text-gray-400 mt-6 mb-2 tracking-wider uppercase';
                catHeader.innerText = item.category;
                container.appendChild(catHeader);
                currentCategory = item.category;
            }

            const qty = state[item.id] || 0;

            // Render Item Baris
            const div = document.createElement('div');
            div.className = 'flex justify-between items-center py-3 border-b border-gray-50';
            div.innerHTML = `
                <div class="flex-1 pr-4">
                    <h3 class="text-sm font-bold text-gray-800 leading-tight">${item.name}</h3>
                    <p class="text-xs text-gray-400 font-medium mt-0.5">Rp ${(item.price).toLocaleString('id-ID')}</p>
                </div>
                <div class="flex items-center gap-3 bg-gray-50 px-2 py-1.5 rounded-full border border-gray-100">
                    <button onclick="updateQty('${item.id}', -1)" class="w-8 h-8 flex justify-center items-center bg-white text-gray-600 rounded-full shadow-sm active:bg-gray-100 transition-all font-bold text-lg leading-none select-none touch-manipulation pb-0.5">-</button>
                    <span id="qty-${item.id}" class="w-5 text-center font-bold text-gray-800 text-sm">${qty}</span>
                    <button onclick="updateQty('${item.id}', 1)" class="w-8 h-8 flex justify-center items-center bg-red-100 text-red-600 rounded-full shadow-sm active:bg-red-200 transition-all font-bold text-lg leading-none select-none touch-manipulation pb-0.5">+</button>
                </div>
            `;
            container.appendChild(div);
        });

        calculateTotal();
    }

    // Fungsi Update Quantity
    function updateQty(id, change) {
        let currentQty = state[id] || 0;
        let newQty = currentQty + change;
        
        if (newQty < 0) newQty = 0;
        state[id] = newQty;
        
        document.getElementById(`qty-${id}`).innerText = newQty;
        saveState();
        calculateTotal();
    }

    // Hitung Total Omset
    function calculateTotal() {
        let total = 0;
        menuData.forEach(item => {
            const qty = state[item.id] || 0;
            total += qty * item.price;
        });
        document.getElementById('totalOmset').innerText = 'Rp ' + total.toLocaleString('id-ID');
    }

    // Simpan ke Local Storage
    function saveState() {
        localStorage.setItem('dfresto_state', JSON.stringify(state));
    }

    // Reset Data Harian
    function resetData() {
        if (confirm('Yakin mau reset semua angka jadi 0 buat shift baru?')) {
            state = {};
            saveState();
            renderMenu();
        }
    }

    // Copy ke WhatsApp
    function copyToWA() {
        let dateStr = document.getElementById('tanggalHariIni').innerText;
        let text = `*LAPORAN D'FRESTO*\nTanggal: ${dateStr}\n\n`;
        let hasData = false;
        let total = 0;
        let currentCategory = '';

        menuData.forEach(item => {
            const qty = state[item.id] || 0;
            if (qty > 0) {
                hasData = true;
                
                // Print Kategori jika belum diprint
                if (item.category !== currentCategory) {
                    text += `\n*${item.category.toUpperCase()}*\n`;
                    currentCategory = item.category;
                }

                text += `- ${item.name} x${qty} = ${(item.price * qty / 1000)}k\n`;
                total += (qty * item.price);
            }
        });

        if (!hasData) {
            alert('Laporan masih kosong cuy, isi dulu angkanya.');
            return;
        }

        text += `\n------------------\n`;
        text += `*TOTAL OMSET: Rp ${total.toLocaleString('id-ID')}*`;

        navigator.clipboard.writeText(text).then(() => {
            alert('Mantap! Format WA udah disalin, tinggal paste aja bro.');
        });
    }

    // Jalankan pertama kali
    renderMenu();
</script>

</body>
</html>
